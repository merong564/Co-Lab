<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lab Pouring System - V9</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-title { color: #003468; font-weight: 800; letter-spacing: -1px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .card-header { background: white; border-bottom: 2px solid #f1f1f1; font-weight: bold; border-radius: 15px 15px 0 0 !important; padding: 15px; }
        .weight-display { font-size: 3.5rem; font-weight: bold; color: #2196f3; font-family: 'Courier New', monospace; }
        .unit { font-size: 1.5rem; color: #777; }
        /* 관절 데이터 강조 스타일 */
        .joint-val { font-family: 'Courier New', monospace; font-weight: bold; color: #003468; }
        
        .btn-estop { 
            width: 100%; height: 60px; font-size: 1.5rem; font-weight: bold; 
            background-color: #dc3545; color: white; border-radius: 10px; 
            animation: pulse 2s infinite; border: 3px solid #b02a37;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="header-title"><i class="fas fa-flask"></i> Smart Lab Pouring System V9</h2>
            <p class="text-muted mb-0">Doosan M0609 & Load Cell Feedback Control (Real-time)</p>
        </div>
        <div id="connection-status" class="badge bg-secondary">System Offline</div>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card h-100">
                <div class="card-header"><i class="fas fa-sliders-h"></i> 실험 제어</div>
                <div class="card-body">
                    <label class="form-label fw-bold">1. 재료</label>
                    <div class="btn-group w-100 mb-3" role="group">
                        <input type="radio" class="btn-check" name="material" id="mat_liquid" autocomplete="off">
                        <label class="btn btn-outline-primary" for="mat_liquid">액체 (Water)</label>
                        <input type="radio" class="btn-check" name="material" id="mat_solid" autocomplete="off" checked>
                        <label class="btn btn-outline-warning" for="mat_solid">고체 (Gravel)</label>
                    </div>

                    <label class="form-label fw-bold">2. 목표 무게</label>
                    <div class="input-group mb-3">
                        <input type="number" id="target_weight" class="form-control form-control-lg" value="50" step="10">
                        <span class="input-group-text">g</span>
                    </div>

                    <label class="form-label fw-bold">3. 속도</label>
                    <input type="range" class="form-range" id="speed_slider" min="1" max="100" value="50">
                    <div class="d-flex justify-content-between text-muted small mb-3">
                        <span>Slow</span><span id="speed_val">50%</span><span>Fast</span>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg" onclick="startExperiment()">실험 시작</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="finishExperiment(true)">강제 종료</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card mb-3 text-center">
                <div class="card-header"><i class="fas fa-balance-scale"></i> 실시간 무게</div>
                <div class="card-body pb-0">
                    <div class="weight-display">
                        <span id="current_weight">0.0</span> <span class="unit">g</span>
                    </div>
                    <div class="progress mt-2 mb-2" style="height: 20px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-dark text-white d-flex justify-content-between">
                    <span><i class="fas fa-chart-line"></i> 분석 대시보드</span>
                    <button class="btn btn-sm btn-light py-0" onclick="exportToCSV()">CSV 저장</button>
                </div>
                <div class="card-body">
                    <div style="height: 250px; width: 100%;">
                        <canvas id="pouringChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3">
            <button class="btn-estop mb-3 shadow" onclick="emergencyStop()">STOP</button>

            <div class="card mb-3">
                <div class="card-header"><i class="fas fa-robot"></i> Robot Joint Angles</div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 1:</span> <span id="val_j1" class="joint-val">-</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 2:</span> <span id="val_j2" class="joint-val">-</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 3:</span> <span id="val_j3" class="joint-val">-</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 4:</span> <span id="val_j4" class="joint-val">-</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 5:</span> <span id="val_j5" class="joint-val">-</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 6:</span> <span id="val_j6" class="joint-val">-</span></li>
                    </ul>
                    <div class="p-2 text-center bg-light border-top">
                         <small class="text-muted">Tilt: <span id="robot_angle">0.0</span>° / Vel: <span id="robot_speed">0</span>%</small>
                    </div>
                </div>
            </div>

            <div class="card h-100">
                <div class="card-header bg-secondary text-white"><i class="fas fa-terminal"></i> Log</div>
                <div class="card-body bg-light p-0">
                    <div id="log-box" style="height: 150px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem;">
                        <span class="text-muted">> System ready...</span><br>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // 1. Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyBOVQ2tEPWe_GfIBavzqcw1ppfe2EqiRdE",
        authDomain: "colab1-78afc.firebaseapp.com",
        databaseURL: "https://colab1-78afc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "colab1-78afc",
        storageBucket: "colab1-78afc.firebasestorage.app",
        messagingSenderId: "312617327218",
        appId: "1:312617327218:web:2564e4ed07449d381dc0eb"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. 변수 및 차트
    let isRunning = false;
    let startTime = 0;
    let experimentData = []; 
    
    const ctx = document.getElementById('pouringChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Weight (g)', data: [], borderColor: '#2196f3', borderWidth: 2, fill: true, backgroundColor: 'rgba(33, 150, 243, 0.1)', pointRadius: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false }, y: { beginAtZero: true, suggestedMax: 100 } } }
    });

    function addLog(msg) {
        const logBox = document.getElementById('log-box');
        const time = new Date().toLocaleTimeString('ko-KR', {hour12:false});
        if(logBox) { logBox.innerHTML += `> [${time}] ${msg}<br>`; logBox.scrollTop = logBox.scrollHeight; }
    }

    document.getElementById('speed_slider').addEventListener('input', function(e) {
        document.getElementById('speed_val').innerText = e.target.value + "%";
    });

    // ==========================================
    // [READ] 데이터 수신 (핵심 부분)
    // ==========================================
    
    // 로봇 상태 수신
    database.ref('robot_status').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('connection-status').className = "badge bg-success";
            document.getElementById('connection-status').innerText = "System Online";

            // 기본 정보
            if(document.getElementById('robot_angle')) document.getElementById('robot_angle').innerText = (data.current_angle || 0).toFixed(1);
            if(document.getElementById('robot_speed')) document.getElementById('robot_speed').innerText = (data.velocity || 0);

            // [중요] 관절 데이터 업데이트
            if (data.joint) {
                document.getElementById('val_j1').innerText = (data.joint.j1 || 0).toFixed(1) + "°";
                document.getElementById('val_j2').innerText = (data.joint.j2 || 0).toFixed(1) + "°";
                document.getElementById('val_j3').innerText = (data.joint.j3 || 0).toFixed(1) + "°";
                document.getElementById('val_j4').innerText = (data.joint.j4 || 0).toFixed(1) + "°";
                document.getElementById('val_j5').innerText = (data.joint.j5 || 0).toFixed(1) + "°";
                document.getElementById('val_j6').innerText = (data.joint.j6 || 0).toFixed(1) + "°";
            } else {
                console.log("Joint data missing in packet"); // 디버깅용
            }
        }
    });

    // 무게 데이터 수신
    database.ref('sensor_data/weight').on('value', (snapshot) => {
        const weight = parseFloat(snapshot.val() || 0);
        document.getElementById('current_weight').innerText = weight.toFixed(1);
        
        // 차트 그리기
        const timeLabel = new Date().toLocaleTimeString();
        if (chart.data.labels.length > 50) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
        chart.data.labels.push(timeLabel);
        chart.data.datasets[0].data.push(weight);
        chart.update();

        // 진행바
        const target = parseFloat(document.getElementById('target_weight').value || 1);
        const percent = Math.min((weight / target) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('progress-bar').innerText = Math.round(percent) + "%";
        
        if (isRunning) {
            const currentTime = ((Date.now() - startTime) / 1000).toFixed(1);
            experimentData.push({ time: currentTime, weight: weight });
        }
    });

    // ==========================================
    // [WRITE] 버튼 동작
    // ==========================================
    function startExperiment() {
        const target = parseFloat(document.getElementById('target_weight').value);
        if(confirm(`실험 시작? (목표: ${target}g)`)) {
            database.ref('commands').set({ type: "start_pouring", target_weight: target, timestamp: Date.now() });
            isRunning = true; startTime = Date.now(); experimentData = [];
            document.getElementById('progress-bar').className = "progress-bar progress-bar-striped progress-bar-animated bg-info";
            addLog(`실험 시작: ${target}g`);
        }
    }

    function finishExperiment(isManual) {
        if (!isRunning) return;
        isRunning = false;
        document.getElementById('progress-bar').className = "progress-bar bg-success"; // 완료 시 초록색
        if (isManual) addLog("강제 종료됨.");
    }

    function emergencyStop() {
        database.ref('commands').set({ type: "emergency_stop", timestamp: Date.now() });
        isRunning = false;
        addLog("🚨 긴급 정지!");
    }
    
    function exportToCSV() { /* CSV 저장 함수 (생략 없이 사용 가능) */
        let csvContent = "data:text/csv;charset=utf-8,Time(s),Weight(g)\r\n";
        experimentData.forEach(row => { csvContent += `${row.time},${row.weight}\r\n`; });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `experiment_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
    }
    
    // 영점 조절 등 추가 함수들
    function sendTare() { database.ref('commands').set({ type: "tare", timestamp: Date.now() }); addLog("영점 조절 요청"); }
    function pourMore(a) { database.ref('commands').set({ type: "pour_more", amount: a, timestamp: Date.now() }); addLog(`${a}g 추가`); }
    function retryPouring() { database.ref('commands').set({ type: "retry_fill", timestamp: Date.now() }); addLog("재시도 요청"); }
</script>

</body>
</html>
