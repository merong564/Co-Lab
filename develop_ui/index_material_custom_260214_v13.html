<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lab Pouring System - V12 Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 기존 스타일 유지 */
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-title { color: #003468; font-weight: 800; letter-spacing: -1px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-header { background: white; border-bottom: 2px solid #f1f1f1; font-weight: bold; padding: 15px; }
        .weight-display { font-size: 3.5rem; font-weight: bold; color: #2196f3; font-family: 'Courier New', monospace; }
        .btn-estop { width: 100%; height: 60px; font-size: 1.5rem; font-weight: bold; background-color: #dc3545; color: white; border-radius: 10px; animation: pulse 2s infinite; border: 3px solid #b02a37; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="header-title"><i class="fas fa-flask"></i> Smart Lab Pouring System V12</h2>
            <p class="text-muted mb-0">Doosan M0609 & Load Cell Feedback Control</p>
        </div>
        <div id="connection-status" class="badge bg-secondary">System Offline</div>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card h-100">
                <div class="card-header"><i class="fas fa-sliders-h"></i> 1. 실험 설정</div>
                <div class="card-body">
                    <label class="form-label fw-bold">재료 선택 (Material)</label>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="material" id="mat_water" value="water" checked>
                            <label class="btn btn-outline-primary w-100" for="mat_water">💧 물</label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="material" id="mat_ethanol" value="ethanol">
                            <label class="btn btn-outline-info w-100" for="mat_ethanol">🧪 에탄올</label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="material" id="mat_gravel" value="gravel">
                            <label class="btn btn-outline-warning w-100" for="mat_gravel">🪨 자갈</label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="material" id="mat_beads" value="beads">
                            <label class="btn btn-outline-success w-100" for="mat_beads">⚪ 비즈</label>
                        </div>
                    </div>

                    <label class="form-label fw-bold">목표 용량</label>
                    <div class="input-group mb-3">
                        <input type="number" id="target_weight" class="form-control form-control-lg" value="50" step="10">
                        <span class="input-group-text">g</span>
                    </div>

                    <label class="form-label fw-bold">속도 설정</label>
                    <input type="range" class="form-range" id="speed_slider" min="1" max="100" value="50">
                    
                    <hr>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-secondary" onclick="sendTare()">영점 조절</button>
                        <button class="btn btn-success btn-lg" onclick="startExperiment()">실험 시작</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card mb-3 text-center">
                <div class="card-header"><i class="fas fa-balance-scale"></i> 실시간 무게</div>
                <div class="card-body pb-0">
                    <div class="weight-display">
                        <span id="current_weight">0.0</span> <span class="unit">g</span>
                    </div>
                    <div class="progress mt-2 mb-2" style="height: 30px;">
                        <div id="progress-bar" class="progress-bar bg-info" style="width: 0%">0%</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header bg-dark text-white d-flex justify-content-between">
                    <span><i class="fas fa-chart-line"></i> 진행 상태</span>
                    <button class="btn btn-sm btn-light py-0" onclick="exportToCSV()">결과 저장</button>
                </div>
                <div class="card-body">
                    <div class="row text-center mb-3">
                        <div class="col-4 border-end"> <small>시간</small><h5 id="elapsed_time" class="fw-bold">0.0s</h5> </div>
                        <div class="col-4 border-end"> <small>오차</small><h5 id="accuracy_val" class="fw-bold text-success">-</h5> </div>
                        <div class="col-4"> <small>상태</small><h5 id="experiment_status" class="fw-bold text-primary">대기</h5> </div>
                    </div>
                    <div style="height: 250px;"><canvas id="pouringChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="col-lg-3">
            <button class="btn-estop mb-3 shadow" onclick="emergencyStop()">긴급 중단 (STOP)</button>
            <div class="card mb-3">
                <div class="card-header"><i class="fas fa-robot"></i> Robot Status</div>
                <div class="card-body">
                    <ul class="list-group list-group-flush mb-2">
                        <li class="list-group-item d-flex justify-content-between"><span>Angle:</span> <span class="badge bg-primary" id="robot_angle">0.0°</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Accel:</span> <span class="badge bg-warning text-dark" id="robot_acc">0.0</span></li>
                    </ul>
                    <small class="text-muted">Joint Angles:</small>
                    <div class="row small text-center">
                        <div class="col-4">J1: <span id="val_j1">-</span></div>
                        <div class="col-4">J2: <span id="val_j2">-</span></div>
                        <div class="col-4">J3: <span id="val_j3">-</span></div>
                        <div class="col-4">J4: <span id="val_j4">-</span></div>
                        <div class="col-4">J5: <span id="val_j5">-</span></div>
                        <div class="col-4">J6: <span id="val_j6">-</span></div>
                    </div>
                </div>
            </div>
            <div class="card h-100">
                <div class="card-header bg-secondary text-white"><i class="fas fa-terminal"></i> Log</div>
                <div class="card-body bg-light p-0">
                    <div id="log-box" style="height: 120px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    // Firebase 설정 (기존과 동일)
    const firebaseConfig = { apiKey: "AIzaSyBOVQ2tEPWe_GfIBavzqcw1ppfe2EqiRdE", authDomain: "colab1-78afc.firebaseapp.com", databaseURL: "https://colab1-78afc-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "colab1-78afc", storageBucket: "colab1-78afc.firebasestorage.app", messagingSenderId: "312617327218", appId: "1:312617327218:web:2564e4ed07449d381dc0eb" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let isRunning = false;
    let startTime = 0;
    let experimentData = [];
    const ctx = document.getElementById('pouringChart').getContext('2d');
    const chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: 'Weight', data: [], borderColor: '#2196f3', borderWidth: 2, fill: true, backgroundColor: 'rgba(33, 150, 243, 0.1)', pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false }, y: { beginAtZero: true } } } });

    function addLog(msg) {
        const logBox = document.getElementById('log-box');
        const time = new Date().toLocaleTimeString('ko-KR', {hour12:false});
        if(logBox) { logBox.innerHTML += `> [${time}] ${msg}<br>`; logBox.scrollTop = logBox.scrollHeight; }
    }

    // 데이터 수신
    database.ref('sensor_data/weight').on('value', (snapshot) => {
        const weight = parseFloat(snapshot.val() || 0);
        const target = parseFloat(document.getElementById('target_weight').value || 1);
        document.getElementById('current_weight').innerText = weight.toFixed(1);
        
        let percent = (weight / target) * 100;
        const progressBar = document.getElementById('progress-bar');
        if(progressBar) {
            progressBar.style.width = Math.min(percent, 100) + "%";
            progressBar.innerText = Math.round(percent) + "%";
            progressBar.className = percent >= 100 ? "progress-bar bg-success" : "progress-bar bg-info";
        }

        // 차트 업데이트
        const timeLabel = new Date().toLocaleTimeString(); 
        if (chart.data.labels.length > 50) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
        chart.data.labels.push(timeLabel);
        chart.data.datasets[0].data.push(weight);
        chart.update();

        if (isRunning) {
            const currentTime = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('elapsed_time').innerText = currentTime + "s";
            document.getElementById('accuracy_val').innerText = (weight - target).toFixed(1) + "g";
            experimentData.push({ time: currentTime, weight: weight });
            
            // 완료 체크 (UI 알림용)
            if (weight >= target) {
                document.getElementById('experiment_status').innerText = "목표 도달!";
                document.getElementById('experiment_status').className = "fw-bold text-success";
            }
        }
    });

    database.ref('robot_status').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('connection-status').className = "badge bg-success";
            document.getElementById('connection-status').innerText = "Online";
            if(data.current_angle) document.getElementById('robot_angle').innerText = data.current_angle + "°";
            if(data.acceleration) document.getElementById('robot_acc').innerText = data.acceleration;
            if (data.joint) {
                for(let i=1; i<=6; i++) document.getElementById(`val_j${i}`).innerText = data.joint[`j${i}`];
            }
        }
    });

    // 제어 함수
    function startExperiment() {
        const target = document.getElementById('target_weight').value;
        const material = document.querySelector('input[name="material"]:checked').value;
        const speed = document.getElementById('speed_slider').value;

        if(confirm(`${material} 실험 시작 (목표: ${target}g)`)) {
            database.ref('commands').set({
                type: "start_pouring",
                target_weight: target,
                material: material,
                initial_speed: speed,
                timestamp: Date.now()
            });
            isRunning = true;
            startTime = Date.now();
            experimentData = [];
            chart.options.scales.y.suggestedMax = Math.max(100, target * 1.2);
            chart.update();
            document.getElementById('experiment_status').innerText = "진행 중...";
            addLog(`실험 시작: ${material}, ${target}g`);
        }
    }

    function emergencyStop() {
        database.ref('commands').set({ type: "emergency_stop", timestamp: Date.now() });
        isRunning = false;
        document.getElementById('experiment_status').innerText = "긴급 정지!";
        document.getElementById('experiment_status').className = "fw-bold text-danger";
        addLog("🚨 긴급 정지 발동!");
    }

    function sendTare() { database.ref('commands').set({ type: "tare", timestamp: Date.now() }); addLog("영점 조절"); }
    function exportToCSV() { /* CSV 저장 로직 동일 */ }
</script>
</body>
</html>
