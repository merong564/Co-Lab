<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lab Monitoring System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { background-color: #f4f6f9; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background-color: white; border-bottom: 2px solid #f0f0f0; font-weight: bold; padding: 15px; }
        .joint-val { font-family: monospace; font-weight: bold; color: #003468; }
        .weight-display { font-size: 3rem; font-weight: 800; color: #2196f3; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h2 class="text-center mb-4 fw-bold" style="color: #003468;">Smart Lab Monitoring & Control</h2>

    <div class="row">
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-header"><i class="fas fa-robot"></i> Robot Joints (Real-time)</div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 1:</span> <span id="j1" class="joint-val">0.00</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 2:</span> <span id="j2" class="joint-val">0.00</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 3:</span> <span id="j3" class="joint-val">0.00</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 4:</span> <span id="j4" class="joint-val">0.00</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 5:</span> <span id="j5" class="joint-val">0.00</span></li>
                        <li class="list-group-item d-flex justify-content-between"><span>Joint 6 (Tilt):</span> <span id="j6" class="joint-val">0.00</span></li>
                    </ul>
                    <div class="alert alert-info mt-3 small">
                        <i class="fas fa-info-circle"></i> /dsr01/joint_states 토픽을 수신 중입니다.
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header"><i class="fas fa-balance-scale"></i> Loadcell Weight</div>
                <div class="card-body text-center">
                    <div class="weight-display"><span id="current_weight">0.0</span> <span style="font-size: 1.5rem; color: #777;">g</span></div>
                    <div class="progress mt-2" style="height: 10px;">
                        <div id="progress-bar" class="progress-bar bg-info" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Weight Analytics (0~100g)</div>
                <div class="card-body">
                    <div style="height: 250px;">
                        <canvas id="weightChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-header"><i class="fas fa-gamepad"></i> Control</div>
                <div class="card-body d-grid gap-2">
                    <button class="btn btn-primary" onclick="startPouring()">Start Pouring</button>
                    <button class="btn btn-secondary" onclick="tareWeight()">Tare (영점)</button>
                    <button class="btn btn-danger py-3" onclick="emergencyStop()">STOP</button>
                    <hr>
                    <div id="log-box" style="height: 150px; overflow-y: auto; background: #eee; padding: 10px; font-size: 0.8rem;">
                        <span>System Ready...</span><br>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // 1. Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyBOVQ2tEPWe_GfIBavzqcw1ppfe2EqiRdE",
        authDomain: "colab1-78afc.firebaseapp.com",
        databaseURL: "https://colab1-78afc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "colab1-78afc",
        storageBucket: "colab1-78afc.firebasestorage.app",
        messagingSenderId: "312617327218",
        appId: "1:312617327218:web:2564e4ed07449d381dc0eb"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. 차트 설정 (0~100g)
    const ctx = document.getElementById('weightChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Weight (g)',
                data: [],
                borderColor: '#2196f3',
                backgroundColor: 'rgba(33, 150, 243, 0.1)',
                borderWidth: 2,
                fill: true,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: false },
                y: { beginAtZero: true, suggestedMax: 100 }
            }
        }
    });

    function addLog(msg) {
        const logBox = document.getElementById('log-box');
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // ============================================
    // [READ] Firebase 데이터 수신 (Bridge에서 보낸 값)
    // ============================================

    // 1. 관절 데이터 수신 (Joint States)
    database.ref('robot_status/joint').on('value', (snapshot) => {
        const joints = snapshot.val();
        if (joints) {
            document.getElementById('j1').innerText = joints.j1.toFixed(2) + "°";
            document.getElementById('j2').innerText = joints.j2.toFixed(2) + "°";
            document.getElementById('j3').innerText = joints.j3.toFixed(2) + "°";
            document.getElementById('j4').innerText = joints.j4.toFixed(2) + "°";
            document.getElementById('j5').innerText = joints.j5.toFixed(2) + "°";
            document.getElementById('j6').innerText = joints.j6.toFixed(2) + "°";
        }
    });

    // 2. 무게 데이터 수신 (Loadcell Weight)
    database.ref('sensor_data/weight').on('value', (snapshot) => {
        const weight = parseFloat(snapshot.val() || 0);
        
        // 숫자 및 바 업데이트
        document.getElementById('current_weight').innerText = weight.toFixed(1);
        const percent = Math.min((weight / 100) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + "%";

        // 차트 업데이트
        const time = new Date().toLocaleTimeString();
        if (chart.data.labels.length > 50) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.data.labels.push(time);
        chart.data.datasets[0].data.push(weight);
        chart.update();
    });

    // ============================================
    // [WRITE] 명령 전송
    // ============================================
    function startPouring() {
        database.ref('commands').set({ type: "start_pouring", timestamp: Date.now() });
        addLog("명령: 붓기 시작");
    }
    function tareWeight() {
        database.ref('commands').set({ type: "tare", timestamp: Date.now() });
        addLog("명령: 영점 조절");
    }
    function emergencyStop() {
        database.ref('commands').set({ type: "emergency_stop", timestamp: Date.now() });
        addLog("🚨 긴급 정지!");
    }
</script>

</body>
</html>
